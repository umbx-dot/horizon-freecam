id = "freecam_plus"
name = "Freecam+"
version = "2.0.0"
description = "Fly the camera away from your body while your player stays perfectly still. WASD, Space and Shift move it, Ctrl goes faster and the mouse wheel changes the speed."
authors = ["_idom_"]
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "4dc6455d4a6773224792eb1f121a9b939dff3170"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "turn"
target = "horizon_client::game::perspective::Game<'_>::turn_player"
kind = "HEAD"
cancellable = true
helper = "src/mixins/turn.rs"
bindings = [
  { name = "xo", ty = "f64", value = "xo" },
  { name = "yo", ty = "f64", value = "yo" },
]
